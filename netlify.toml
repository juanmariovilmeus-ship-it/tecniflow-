[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 1. API routes: routed to Netlify Functions BEFORE SPA fallback
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# 2. SPA fallback: all other requests route to Vite index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
